name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mylife_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/dummy_app?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/dummy_app?schema=public"
      TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mylife_test?schema=public"
      TEST_DB_ALLOWED_HOSTS: "localhost,127.0.0.1"
      AUTH_SECRET: "ci-test-secret-0123456789abcdef0123456789abcdef"
      AUTH_ACCESS_CODE: "ci-test-access-code"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Setup test database schema
        run: |
          npm run db:test:prepare
          npx tsx scripts/setup-db-constraints.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build